<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0f">
<title>Ask</title>
<style>
  /* Change these four colours to re-theme the whole page. */
  :root { --bg:#0b0c0f; --dot:#8f8a7e; --glow:#ffb25c; --text:#f1ece2; --dim:#8f8a80; --line:rgba(241,236,226,.22); }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--text);
    font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .ui { position:fixed; left:0; right:0; bottom:0; padding:0 20px max(28px, env(safe-area-inset-bottom)); display:flex; flex-direction:column; align-items:center; gap:10px; }
  #caption { width:min(640px,100%); min-height:4.2em; margin:0; text-align:center; font:italic 400 clamp(18px,2.6vw,22px)/1.45 "Iowan Old Style", "Palatino Linotype", Georgia, serif; }
  #sources { min-height:1.2em; margin:0; font-size:12px; letter-spacing:.04em; color:var(--dim); opacity:0; transition:opacity .6s; text-align:center; }
  #sources.on { opacity:1; }
  form { width:min(560px,100%); display:flex; gap:8px; align-items:center; border:1px solid var(--line); border-radius:99px; padding:6px 6px 6px 20px; background:rgba(11,12,15,.6); backdrop-filter:blur(6px); transition:border-color .25s, box-shadow .25s; }
  form:focus-within { border-color:var(--glow); box-shadow:0 0 28px -8px var(--glow); }
  input { flex:1; min-width:0; background:none; border:0; outline:0; color:var(--text); font:inherit; font-size:16px; }
  input::placeholder { color:var(--dim); }
  button { border:0; border-radius:99px; width:38px; height:38px; background:var(--glow); color:#17120a; cursor:pointer; display:grid; place-items:center; flex:none; }
  button:disabled { opacity:.4; cursor:default; }
  button svg { width:18px; height:18px; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div class="ui">
  <p id="caption" aria-live="polite"></p>
  <p id="sources"></p>
  <form id="f" autocomplete="off">
    <input id="q" maxlength="500" placeholder="Ask me anything about my research" aria-label="Your question" enterkeyhint="send">
    <button id="send" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </form>
</div>
<noscript><p style="position:fixed;top:40%;width:100%;text-align:center">This page needs JavaScript.</p></noscript>

<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const cap = document.getElementById('caption'), srcEl = document.getElementById('sources');
  const input = document.getElementById('q'), form = document.getElementById('f'), sendBtn = document.getElementById('send');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const DIM = hex(css('--dot')), GLOW = hex(css('--glow'));

  // ---- the ball: points spread evenly over a sphere ----
  const N = 1500, pts = [];
  for (let i = 0; i < N; i++) {
    const y = 1 - (i + 0.5) / N * 2, r = Math.sqrt(1 - y * y), th = i * 2.399963229728653;
    pts.push({ x: Math.cos(th) * r, y, z: Math.sin(th) * r, s: Math.random() });
  }

  let W, H, dpr, R, cx, cy;
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = cv.width = innerWidth * dpr; H = cv.height = innerHeight * dpr;
    R = Math.max(90 * dpr, Math.min(W * 0.30, H * 0.25));
    cx = W / 2; cy = H * 0.38;
  }
  addEventListener('resize', resize); resize();

  // ---- state: how "alive" the ball is ----
  let mode = 'idle';          // idle | listening | thinking | talking
  let energy = 0, impulse = 0, t = 0, lightAngle = 0, last = performance.now();

  const kick = v => { impulse = Math.max(impulse, v); };

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
    // energy chases the impulse, and the impulse fades like a voice trailing off
    energy += (impulse - energy) * 0.28; impulse *= 0.88;
    let base = 0.05, speed = 0.35;
    if (mode === 'thinking') { base = 0.16 + 0.08 * Math.sin(t * 5); speed = 1.7; }
    if (mode === 'talking') { speed = 0.7 + energy * 2.2; }
    if (mode === 'listening') { base = 0.1; speed = 0.5; }
    const e = Math.max(energy, base);
    lightAngle += dt * speed * (reduce ? 0.4 : 1);

    // the light roams over the surface
    let lx = Math.cos(lightAngle) * 0.9, ly = Math.sin(lightAngle * 0.8) * 0.55, lz = 0.65 + 0.3 * Math.sin(lightAngle * 0.5);
    const ll = Math.hypot(lx, ly, lz); lx /= ll; ly /= ll; lz /= ll;

    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';

    // soft glow that follows the light
    const gx = cx + lx * R * 0.7, gy = cy + ly * R * 0.7, gr = R * (1.0 + e * 0.5);
    const g = ctx.createRadialGradient(gx, gy, 0, gx, gy, gr);
    g.addColorStop(0, `rgba(${GLOW},${0.16 + e * 0.30})`); g.addColorStop(1, `rgba(${GLOW},0)`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    const rot = reduce ? 0.5 : t * 0.12, cr = Math.cos(rot), sr = Math.sin(rot), tilt = 0.32, ct = Math.cos(tilt), st = Math.sin(tilt);
    for (let i = 0; i < N; i++) {
      const p = pts[i];
      const x1 = p.x * cr + p.z * sr, z1 = -p.x * sr + p.z * cr;
      const y2 = p.y * ct - z1 * st, z2 = p.y * st + z1 * ct;                 // unit normal = (x1, y2, z2)
      const depth = (z2 + 1) / 2;                                              // 0 back .. 1 front
      const wob = 1 + e * 0.07 * Math.sin(p.y * 7 + t * 13 + p.s * 6);         // speech ripples through the surface
      const lit = Math.max(0, x1 * lx + y2 * ly + z2 * lz);
      const bright = Math.min(1, 0.12 + Math.pow(lit, 2.2) * (0.75 + e * 1.3) + 0.08 * (1 - depth));
      const sc = (0.85 + 0.25 * depth) * wob;
      const k = Math.pow(bright, 1.2);
      const rad = (0.7 + 1.9 * bright) * dpr * (0.6 + 0.5 * depth);
      ctx.fillStyle = `rgba(${DIM[0] + (GLOW[0] - DIM[0]) * k | 0},${DIM[1] + (GLOW[1] - DIM[1]) * k | 0},${DIM[2] + (GLOW[2] - DIM[2]) * k | 0},${(0.14 + 0.86 * bright * (0.4 + 0.6 * depth)).toFixed(3)})`;
      ctx.beginPath(); ctx.arc(cx + x1 * R * sc, cy + y2 * R * sc, rad, 0, 6.2832); ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---- the ball reacts while you type ----
  input.addEventListener('input', () => {
    kick(0.3); lightAngle += 0.5;
    if (mode === 'idle' || mode === 'listening') mode = input.value ? 'listening' : 'idle';
  });
  input.addEventListener('blur', () => { if (mode === 'listening') mode = 'idle'; });

  // ---- the ball "speaks": the reply types out and each letter drives the light ----
  const VOWEL = { a: 1, o: 1, u: 0.75, e: 0.65, i: 0.55 };
  const amp = c => { const l = c.toLowerCase(); if (VOWEL[l]) return VOWEL[l]; if ('bmp'.includes(l)) return 0.2; return /[a-z]/.test(l) ? 0.42 : 0.1; };
  let typer = null;
  function speak(text, sources) {
    clearInterval(typer); cap.textContent = ''; srcEl.classList.remove('on'); mode = 'talking';
    let i = 0;
    typer = setInterval(() => {
      const c = text[i++] || '';
      cap.textContent += c; kick(amp(c) * (0.8 + Math.random() * 0.4));
      if (i >= text.length) {
        clearInterval(typer); mode = input.value ? 'listening' : 'idle'; busy = false; sendBtn.disabled = false;
        if (sources && sources.length) { srcEl.textContent = 'From my notes: ' + sources.slice(0, 4).join(' · '); srcEl.classList.add('on'); }
      }
    }, reduce ? 12 : 34);
  }

  let busy = false;
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const q = input.value.trim(); if (!q || busy) return;
    busy = true; sendBtn.disabled = true; input.value = ''; srcEl.classList.remove('on'); clearInterval(typer);
    cap.textContent = ''; mode = 'thinking'; kick(0.4);
    try {
      const r = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: q }) });
      const d = await r.json();
      speak(d.reply || d.error || "Something went wrong. Try again.", d.sources);
    } catch (err) {
      speak("I can't reach my notes right now. Try again in a moment.", []);
    }
  });

  setTimeout(() => { busy = true; sendBtn.disabled = true; speak('Hi. Ask me anything about my research.', []); }, 700);
  if (matchMedia('(hover: hover)').matches) input.focus();
})();
</script>
</body>
</html>
